services:
  - type: web
    name: superr-selector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/overview
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
