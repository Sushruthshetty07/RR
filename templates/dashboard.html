<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rajasthan Royals SupeRR Selector 2.0 — IPL Player Reliability &amp; Auction Intelligence</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-2: #1b2640;
      --border: #2a395c;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --rr-pink: #ec4899;
      --rr-pink-dark: #be185d;
      --rr-blue: #38bdf8;
      --rr-royal: #1e3a8a;
      --gold: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #4a044e 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 0.85rem; }
    .badge-hdr { background: var(--rr-pink); color: #fff; font-size: 0.72rem; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      padding: 13px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--rr-pink); background: rgba(236, 72, 153, 0.08); }
    main { max-width: 1440px; margin: 0 auto; padding: 24px 28px 80px; }
    .alert {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 10px;
      padding: 13px 18px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .alert strong { color: #fbbf24; }
    .alert-info {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .alert-info strong { color: var(--rr-blue); }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 18px; margin-bottom: 22px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .kpi-label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-val { font-size: 1.7rem; font-weight: 700; margin-top: 4px; }
    .kpi-sub { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      align-items: center;
    }
    .filters input, .filters select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 11px;
      font-size: 0.85rem;
    }
    .filters label { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.76rem; text-transform: uppercase; background: var(--surface-2); position: sticky; top: 0; }
    tr.clickable:hover { background: rgba(236, 72, 153, 0.08); cursor: pointer; }
    .table-wrap { max-height: 580px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .b-confirmed { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .b-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .b-trade { background: rgba(167, 139, 250, 0.22); color: #c4b5fd; }
    .b-rr { background: rgba(236, 72, 153, 0.22); color: #f472b6; }
    .b-contracted { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
    .b-retired { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .b-unknown { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
    .b-warn { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
    .b-info { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; }
    .pill-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: 0.15s;
    }
    .pill:hover { color: var(--text); }
    .pill.active { background: var(--rr-pink); border-color: var(--rr-pink); color: #fff; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.8);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      max-width: 940px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 14px; }
    .close-btn { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    .kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .kv { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
    .kv .k { font-size: 0.73rem; color: var(--muted); text-transform: uppercase; }
    .kv .v { font-size: 0.96rem; font-weight: 600; margin-top: 2px; }
    .bar-wrap { background: var(--bg); border-radius: 4px; overflow: hidden; height: 12px; width: 100%; position: relative; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--rr-blue), var(--rr-pink)); }
    a { color: var(--rr-blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>
        Rajasthan Royals SupeRR Selector 2.0
        <span class="badge-hdr">IPL 2027</span>
      </h1>
      <p>Player Reliability, High-Pressure Clutch Evaluation &amp; Auction Intelligence | 200,999 Deliveries | 867 Matches</p>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div class="mode-switch" style="display:flex;gap:8px">
        <button class="pill active" onclick="openTab('auction_intelligence')">Dashboard B: RR Auction Scouting</button>
        <button class="pill" onclick="openTab('batting')">Dashboard A: Performance Analytics</button>
      </div>
      <div style="font-size:0.82rem; color:var(--muted); text-align:right">
        <span>Verified As Of: <strong>{{ as_of_date }}</strong></span><br />
        <span>Primary Data Pool: <strong>193,144 balls</strong> (IPL w=1.0, T20I w=0.5)</span>
      </div>
    </div>
  </header>

  <nav id="main-nav">
    <button class="tab-btn active" data-tab="overview" onclick="openTab('overview')">1. Overview</button>
    <button class="tab-btn" data-tab="batting" onclick="openTab('batting')">2. Batter Scouting</button>
    <button class="tab-btn" data-tab="bowling" onclick="openTab('bowling')">3. Bowler Scouting</button>
    <button class="tab-btn" data-tab="compare" onclick="openTab('compare')">4. Player Comparison</button>
    <button class="tab-btn" data-tab="pressure_leverage" onclick="openTab('pressure_leverage')">5. Pressure &amp; Leverage</button>
    <button class="tab-btn" data-tab="auction_intelligence" onclick="openTab('auction_intelligence')">6. RR Auction Intelligence</button>
    <button class="tab-btn" data-tab="model_eval" onclick="openTab('model_eval')">7. Model Evaluation</button>
  </nav>

  <main id="app-content">
    <div class="card">Loading Rajasthan Royals SupeRR Selector...</div>
  </main>

  <div id="player-modal" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="player-modal-body"></div>
  </div>

<script>
const STATE = {
  tab: 'overview',
  batView: 'dual',
  bowlView: 'dual',
  auctionBucket: 'pending_registration',
  filters: { search: '', role: '', availability: '', ipl_exp: '', pressure_tier: '', confidence_tier: '', all_rounder_only: false },
  compareIds: [1699, 6396, 2933, 7920]
};

function statusBadge(st) {
  const map = {
    'Confirmed auction-available': 'b-confirmed',
    'Released, auction registration pending/unverified': 'b-pending',
    'Potential trade candidate': 'b-trade',
    'Existing Rajasthan Royals player': 'b-rr',
    'Contracted to another franchise': 'b-contracted',
    'Retired': 'b-retired',
    'Unknown/unverified': 'b-unknown'
  };
  return `<span class="badge ${map[st] || 'b-unknown'}">${st}</span>`;
}

function openTab(t) {
  STATE.tab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  renderTab();
}

function filterQuery(extra = {}) {
  const p = new URLSearchParams({
    search: STATE.filters.search,
    role: STATE.filters.role,
    availability: STATE.filters.availability,
    ipl_exp: STATE.filters.ipl_exp,
    pressure_tier: STATE.filters.pressure_tier,
    confidence_tier: STATE.filters.confidence_tier,
    all_rounder_only: STATE.filters.all_rounder_only ? 'true' : 'false',
    ...extra
  });
  return p.toString();
}

function filterBarHtml(showAvail = true) {
  return `<div class="filters">
    <input type="text" placeholder="Search player, team, role..." value="${STATE.filters.search}" onchange="STATE.filters.search=this.value; renderTab()" />
    <select onchange="STATE.filters.role=this.value; renderTab()">
      <option value="">All Roles</option>
      <option value="Opener" ${STATE.filters.role==='Opener'?'selected':''}>Opener</option>
      <option value="Wicketkeeper" ${STATE.filters.role==='Wicketkeeper'?'selected':''}>Wicketkeeper-Batter</option>
      <option value="Finisher" ${STATE.filters.role==='Finisher'?'selected':''}>Finisher</option>
      <option value="All-Rounder" ${STATE.filters.role==='All-Rounder'?'selected':''}>All-Rounder</option>
      <option value="Pace" ${STATE.filters.role==='Pace'?'selected':''}>Pace</option>
      <option value="Spin" ${STATE.filters.role==='Spin'?'selected':''}>Spin</option>
      <option value="Death" ${STATE.filters.role==='Death'?'selected':''}>Death Specialist</option>
    </select>
    ${showAvail ? `<select onchange="STATE.filters.availability=this.value; renderTab()">
      <option value="">All Availability</option>
      <option value="Confirmed auction-available" ${STATE.filters.availability==='Confirmed auction-available'?'selected':''}>Confirmed auction-available</option>
      <option value="Released, auction registration pending/unverified" ${STATE.filters.availability==='Released, auction registration pending/unverified'?'selected':''}>Pending Registration</option>
      <option value="Potential trade candidate" ${STATE.filters.availability==='Potential trade candidate'?'selected':''}>Potential trade candidate</option>
      <option value="Existing Rajasthan Royals player" ${STATE.filters.availability==='Existing Rajasthan Royals player'?'selected':''}>Existing RR player</option>
      <option value="Contracted to another franchise" ${STATE.filters.availability==='Contracted to another franchise'?'selected':''}>Contracted elsewhere</option>
      <option value="Retired" ${STATE.filters.availability==='Retired'?'selected':''}>Retired</option>
    </select>` : ''}
    <select onchange="STATE.filters.pressure_tier=this.value; renderTab()">
      <option value="">All Pressure Tiers</option>
      <option value="Elite Proven Under Pressure" ${STATE.filters.pressure_tier==='Elite Proven Under Pressure'?'selected':''}>Elite Proven Under Pressure</option>
      <option value="Strong Pressure Performer" ${STATE.filters.pressure_tier==='Strong Pressure Performer'?'selected':''}>Strong Pressure Performer</option>
      <option value="Unproven in HP (Neff_HP = 0)" ${STATE.filters.pressure_tier==='Unproven in HP (Neff_HP = 0)'?'selected':''}>Unproven in HP (Neff_HP = 0)</option>
    </select>
    <label><input type="checkbox" ${STATE.filters.all_rounder_only?'checked':''} onchange="STATE.filters.all_rounder_only=this.checked; renderTab()" /> Dual AR Only</label>
    <button class="close-btn" onclick="STATE.filters={search:'',role:'',availability:'',ipl_exp:'',pressure_tier:'',confidence_tier:'',all_rounder_only:false}; renderTab()">Reset</button>
  </div>`;
}

async function renderTab() {
  const el = document.getElementById('app-content');
  if (STATE.tab === 'overview') return renderOverview(el);
  if (STATE.tab === 'batting') return renderBattingScouting(el);
  if (STATE.tab === 'bowling') return renderBowlingScouting(el);
  if (STATE.tab === 'compare') return renderCompare(el);
  if (STATE.tab === 'pressure_leverage') return renderPressureLeverage(el);
  if (STATE.tab === 'auction_intelligence') return renderAuctionIntelligence(el);
  if (STATE.tab === 'model_eval') return renderModelEvaluation(el);
}

// -------------------------------------------------------------
// PAGE 1: OVERVIEW
// -------------------------------------------------------------
async function renderOverview(el) {
  const [d, dims, wp] = await Promise.all([
    fetch('/api/overview').then(r => r.json()),
    fetch('/api/evaluation-dimensions').then(r => r.json()),
    fetch('/api/win-probability').then(r => r.json())
  ]);

  el.innerHTML = `
    <div class="alert alert-info">
      <strong>Executive Thesis:</strong> Across <strong>200,999 deliveries</strong> (867 matches), we evaluate T20 players across three strictly separated dimensions:
      <strong>(A) Overall Reliability</strong>, <strong>(B) High-Pressure Clutch Performance</strong>, and <strong>(C) Rajasthan Royals Tactical Fit</strong>.
      We eliminate the conflation between explosive Powerplay pace-setting and late-innings clutch chasing, enforcing empirical Bayes shrinkage and Kish effective sample size gates.
    </div>

    <div class="grid-4">
      <div class="card"><div class="kpi-label">Primary Deliveries</div><div class="kpi-val" style="color:var(--rr-blue)">${d.universe_counts.primary_deliveries.toLocaleString()}</div><div class="kpi-sub">IPL (w=1.0) + T20I (w=0.5)</div></div>
      <div class="card"><div class="kpi-label">Eligible Universe</div><div class="kpi-val">${d.universe_counts.eligible_batters} / ${d.universe_counts.eligible_bowlers}</div><div class="kpi-sub">Batters / Bowlers (Neff &ge; 30)</div></div>
      <div class="card"><div class="kpi-label">RR 2026 Baseline</div><div class="kpi-val" style="color:var(--rr-pink)">8–6 (3rd)</div><div class="kpi-sub">Guwahati 3/3 | Jaipur 1/4 (Pace Leak)</div></div>
      <div class="card"><div class="kpi-label">WP vs PI Correlation</div><div class="kpi-val" style="color:var(--gold)">r = -0.20</div><div class="kpi-sub">Pressure != Leverage Quantified</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Top Analytical Insights</div>
        <div class="kv" style="margin-bottom:8px">
          <div class="k">1. The Powerplay Exposure Paradox (Neff_HP = 0.0)</div>
          <div class="v" style="font-size:0.86rem;font-weight:400">
            Elite openers like <strong>#2 Vaibhav Sooryavanshi</strong> and <strong>#5 Finn Allen</strong> earn top overall reliability solely from overs 1–6 dominance. They face <strong>0 high-pressure balls</strong> (PI &ge; 60) and must never be mislabeled as death closers.
          </div>
        </div>
        <div class="kv" style="margin-bottom:8px">
          <div class="k">2. Asymmetric Venue Splits at SMS Jaipur vs ACA Guwahati</div>
          <div class="v" style="font-size:0.86rem;font-weight:400">
            RR was undefeated at ACA Guwahati (3/3) with spin dominance, but suffered a 1/4 record at SMS Jaipur due to a severe pace leak (10.13 RPO vs 9.26 league benchmark), mandating death pace acquisition.
          </div>
        </div>
        <div class="kv">
          <div class="k">3. Pressure vs Leverage Distinction</div>
          <div class="v" style="font-size:0.86rem;font-weight:400">
            Pressure measures <em>chase difficulty / jeopardy</em>, while Leverage measures <em>win probability swing magnitude</em>. In hopeless chases (RRR &ge; 24), pressure is high but leverage collapses to near zero.
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Three Separated Evaluation Dimensions</div>
        <div class="kv" style="margin-bottom:8px">
          <div class="k" style="color:var(--rr-blue)">Dimension A: Overall Reliability</div>
          <div class="v" style="font-size:0.86rem;font-weight:400">Evaluates consistent volume across all match phases using Kish effective sample size (Neff &ge; 30) and Bayesian LCB composite score (PRI_lcb).</div>
        </div>
        <div class="kv" style="margin-bottom:8px">
          <div class="k" style="color:var(--rr-pink)">Dimension B: High-Pressure Performance</div>
          <div class="v" style="font-size:0.86rem;font-weight:400">Evaluates performance strictly on deliveries with PI &ge; 60. Imposes a strict evidence threshold (Neff_HP &ge; 30 for robust ranking). Displays "Insufficient Evidence" for Neff_HP &lt; 15.</div>
        </div>
        <div class="kv">
          <div class="k" style="color:var(--gold)">Dimension C: RR Tactical Fit</div>
          <div class="v" style="font-size:0.86rem;font-weight:400">Evaluates player compatibility against RR's specific tactical voids (Death Pace, Attacking Spin, RHB Finisher) and BCCI auction eligibility buckets.</div>
        </div>
      </div>
    </div>
  `;
}

// -------------------------------------------------------------
// PAGE 2: BATTER SCOUTING
// -------------------------------------------------------------
async function renderBattingScouting(el) {
  const [d, dims] = await Promise.all([
    fetch('/api/dashboard-a?' + filterQuery({ discipline: 'batting' })).then(r => r.json()),
    fetch('/api/evaluation-dimensions').then(r => r.json())
  ]);

  const batDims = dims.batting;

  el.innerHTML = `
    <div class="pill-tabs">
      <button class="pill ${STATE.batView==='dual'?'active':''}" onclick="STATE.batView='dual'; renderTab()">Separated Leaderboards (Overall vs High Pressure)</button>
      <button class="pill ${STATE.batView==='all'?'active':''}" onclick="STATE.batView='all'; renderTab()">Complete Eligible Universe (${d.total_eligible} Batters)</button>
    </div>

    ${STATE.batView === 'dual' ? `
      <div class="grid-2">
        <div class="card">
          <div class="card-title" style="color:var(--rr-blue)">Dimension A: Top 10 Overall Reliable Batters</div>
          <p class="kpi-sub" style="margin-top:-6px; margin-bottom:12px">Evaluates volume &amp; consistency across all phases (PRI_lcb)</p>
          <table><thead><tr><th>Rank</th><th>Player</th><th>PRI_lcb</th><th>Neff</th><th>Neff_HP</th><th>HP Evidence</th></tr></thead><tbody>
          ${batDims.top10_overall_reliability.map((r, i) => `<tr class="clickable" onclick="openPlayer(${r.canonical_player_id})">
            <td><strong>#${i+1}</strong></td>
            <td><strong>${r.player_name}</strong></td>
            <td><strong>${r.pri_score_lcb.toFixed(2)}</strong></td>
            <td>${r.neff.toFixed(0)}</td>
            <td>${r.neff_hp.toFixed(1)}</td>
            <td>${r.neff_hp === 0 ? '<span class="badge b-warn">Zero HP Exposure</span>' : '<span class="badge b-info">Proven</span>'}</td>
          </tr>`).join('')}
          </tbody></table>
        </div>

        <div class="card">
          <div class="card-title" style="color:var(--rr-pink)">Dimension B: Top 10 High-Pressure Clutch Batters</div>
          <p class="kpi-sub" style="margin-top:-6px; margin-bottom:12px">Strictly filtered to robust evidence (Neff_HP &ge; 30) on PI &ge; 60</p>
          <table><thead><tr><th>Rank</th><th>Player</th><th>HP-RAA (runs/100b)</th><th>Neff_HP</th><th>Overall PRI</th></tr></thead><tbody>
          ${batDims.top10_high_pressure_robust.map((r, i) => `<tr class="clickable" onclick="openPlayer(${r.canonical_player_id})">
            <td><strong>#${i+1}</strong></td>
            <td><strong>${r.player_name}</strong></td>
            <td><strong style="color:var(--green)">+${r.hp_raa_post.toFixed(2)}</strong></td>
            <td>${r.neff_hp.toFixed(1)}</td>
            <td>${r.pri_score_lcb.toFixed(1)}</td>
          </tr>`).join('')}
          </tbody></table>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-title" style="color:var(--gold)">Powerplay Pace-Setters (Zero High-Pressure Exposure)</div>
        <p class="kpi-sub" style="margin-top:-6px; margin-bottom:10px">Ranked elite in overall PRI solely from overs 1–6 destruction; zero clutch chase exposure (Neff_HP = 0.0).</p>
        <table><thead><tr><th>Player</th><th>Overall PRI</th><th>Total Neff</th><th>Exposure Diagnostic</th></tr></thead><tbody>
        ${batDims.pp_specialists_zero_hp.map(r => `<tr class="clickable" onclick="openPlayer(${r.canonical_player_id})">
          <td><strong>${r.player_name}</strong></td>
          <td>${r.pri_score_lcb.toFixed(2)}</td>
          <td>${r.neff.toFixed(0)}</td>
          <td><span class="badge b-warn">Neff_HP = 0.0 (Unproven in late-innings crunch)</span></td>
        </tr>`).join('')}
        </tbody></table>
      </div>
    ` : `
      ${filterBarHtml(true)}
      <div class="table-wrap"><table><thead><tr>
        <th>PRI Rank</th><th>Player</th><th>Role</th><th>PRI_lcb</th><th>95% Rank CI</th><th>Neff</th><th>Neff_HP</th><th>HP Evidence Status</th><th>2027 Status</th>

        ` : `
          <div class="kv"><div class="k">Gen RSAA / WAA (r/ov)</div><div class="v">${d.rsaa_post} / ${d.waa_post}</div></div>
          <div class="kv"><div class="k">HP-Impact / Cons (r/ov)</div><div class="v">${d.hp_impact_post} / ${d.cons_post}</div></div>
          <div class="kv"><div class="k">True Econ / IPL True Econ</div><div class="v">${d.true_econ ?? '—'} / ${d.ipl_true_econ ?? '—'}</div></div>
          <div class="kv"><div class="k">PP / Mid / Death Econ</div><div class="v">${d.powerplay_econ ?? '—'} / ${d.middle_econ ?? '—'} / ${d.death_econ ?? '—'}</div></div>
        `}
      </div>
    </div>`;
  };
  document.getElementById('player-modal-body').innerHTML = `
    <div class="modal-head">
      <div>
        <h2 style="margin:0">${p.player_name} <span style="font-size:0.85rem;color:var(--muted)">(ID: ${p.canonical_player_id})</span></h2>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
          ${statusBadge(p.availability_status)}
          <span class="kpi-sub">2026: ${p.ipl_2026_team} &rarr; 2027: <strong>${p.current_2027_team}</strong></span>
          <span class="kpi-sub">| ${p.nationality} | ${p.cap_status} | Age: ${p.age_2026}</span>
        </div>
      </div>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
    <div class="kv" style="margin-bottom:12px"><div class="k">RR Acquisition Pathway</div><div class="v">${p.acquisition_pathway}</div><div class="kpi-sub">Verified ${p.last_verified_date} — <a href="${p.source_url}" target="_blank">${p.source_name}</a></div></div>
    ${discBlock('Batting Profile', p.batting, true)}
    ${discBlock('Bowling Profile', p.bowling, false)}
  `;
  document.getElementById('player-modal').classList.add('open');
}

function closeModal() { document.getElementById('player-modal').classList.remove('open'); }
renderTab();
</script>
</body>
</html>
